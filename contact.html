<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="en-tete">
        <div class="conteneur en-tete-contenu">
            <a href="index.html" class="logo"><img src="img/fitnessLogo.jpg" alt="logo" width="60px">Élan Fitness</a>

            <nav aria-label="Navigation principale">
                <ul class="menu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="propos.html">À propos</a></li>
                    <li><a href="programmes.html">Programmes</a></li>
                    <li><a href="contact.html" class="lien-actif">Contactez-nous</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section>
        <form>
            <fieldset>
                <legend id="title">
                    <h1>Contactez-nous</h1>
                </legend>
                <div class="content">
                    <label for="name" class="title_input">Nom complet :</label><br>
                    <input type="name" id="name" name="name" placeholder="entrez votre nom complet">
                </div>
                <div class="content">
                    <label for="email" class="title_input">email :</label><br>
                    <input type="email" id="email" name="email" placeholder="entrez votre email">
                </div>
                <div class="content">
                    <label for="message" class="title_input">Message :</label><br>
                    <textarea name="message" id="message" placeholder="entrez votre message"></textarea>
                </div>
                <button type="submit" class="bouton-principal">Submit</button>
            </fieldset>
        </form>
    </section>
    <footer class="pied-de-page">
        <div class="conteneur">

            <div class="pied-haut">
                <div>
                    <p class="logo logo-clair">Élan Fitness</p>
                    <p class="slogan">Ton énergie, ton rythme.</p>
                </div>

                <nav aria-label="Navigation du pied de page">
                    <ul class="menu menu-pied">
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="propos.html">À propos</a></li>
                        <li><a href="programmes.html">Programmes</a></li>
                        <li><a href="contact.html">Contactez-nous</a></li>
                    </ul>
                </nav>
            </div>

            <div class="pied-bas">
                <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
                <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
            </div>

        </div>
    </footer>
</body>

</html>
